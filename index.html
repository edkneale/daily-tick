<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#f4f3ef"/>
<title>Today · Wed 23 Sep</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    background: #f4f3ef; color: #1a1a1a; font-family: -apple-system, system-ui, sans-serif; max-width: 520px; margin-inline: auto; }
  h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .quiet { color: #6b7280; font-size: 13px; margin: 6px 0 16px; line-height: 1.4; }
  .card { background: #fff; border-radius: 16px; padding: 4px 8px 10px; border: 1.5px solid #111;
    box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 14px; }
  .head { margin: 10px 8px 6px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em;
    display: flex; align-items: center; }
  .progress { margin-left: auto; font-size: 12px; font-weight: 600; color: #6b7280; }
  .job { display: block; width: 100%; text-align: left; border: none; background: transparent; font: inherit;
    border-top: 1px solid #f0f0ec; padding: 12px 8px; border-radius: 12px; cursor: pointer; }
  .job:first-of-type { border-top: none; }
  .job.done .title { text-decoration: line-through; color: #9ca3af; }
  .job.done .tick { background: #22c55e; border-color: #22c55e; }
  .job.done .tick::after { content: ""; position: absolute; left: 5px; top: 2px; width: 5px; height: 9px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .row { display: flex; align-items: flex-start; gap: 12px; }
  .tick { position: relative; width: 28px; height: 28px; border: 2.5px solid #9ca3af; border-radius: 8px; flex-shrink: 0; }
  .left { flex: 1; min-width: 0; }
  .time { font-size: 13px; font-weight: 700; color: #111; }
  .title { font-size: 15px; font-weight: 650; margin-top: 2px; }
  .step { font-size: 13px; color: #4b5563; margin-top: 4px; }
  .slot { padding: 12px 8px; border-top: 1px solid #f0f0ec; }
  .slot:first-of-type { border-top: none; }
  .what { font-size: 16px; font-weight: 650; margin-top: 2px; }
  .where { font-size: 13px; color: #6b7280; margin-top: 3px; }
</style>
</head>
<body>
  <h1>Today · Wed 23 Sep</h1>
  <div class="quiet">One task per block · weekend is upcoming, not today</div>

  <div class="card">
    <div class="head">What have I got on today?</div>
    <div class="slot">
      <div class="time">16:00–17:00</div>
      <div class="what">Z2 bike 60</div>
      <div class="where">Zwift OK · easy spin</div>
    </div>
  </div>

  <div class="card">
    <div class="head">Coming up</div>
    <div class="slot">
      <div class="time">Sat 26 · 08:00–13:00</div>
      <div class="what">Drive to Devon</div>
    </div>
    <div class="slot">
      <div class="time">Sun 27 · 09:45–17:00</div>
      <div class="what">River Cottage — mushroom day</div>
      <div class="where">EX13 8TB</div>
    </div>
  </div>

  <div class="card">
    <div class="head">Do today <span class="progress" id="progress">0 / 5</span></div>
    <button type="button" class="job" data-id="robin" aria-pressed="false">
      <div class="row"><div class="tick"></div><div class="left">
        <div class="time">13:40–13:50</div>
        <div class="title">Call Robin — Saturday visit</div>
        <div class="step">First: dial Robin, Sat 26 yes/no</div>
      </div></div>
    </button>
    <button type="button" class="job" data-id="benjamin" aria-pressed="false">
      <div class="row"><div class="tick"></div><div class="left">
        <div class="time">13:50–14:20</div>
        <div class="title">Email Benjamin — Cadent £684</div>
        <div class="step">First: send with £684 incl VAT (do not add VAT again)</div>
      </div></div>
    </button>
    <button type="button" class="job" data-id="hotel" aria-pressed="false">
      <div class="row"><div class="tick"></div><div class="left">
        <div class="time">14:20–14:50</div>
        <div class="title">Book Devon hotel</div>
        <div class="step">First: 3 options near Axminster / EX13, Fri–Sat</div>
      </div></div>
    </button>
    <button type="button" class="job" data-id="chris" aria-pressed="false">
      <div class="row"><div class="tick"></div><div class="left">
        <div class="time">14:50–15:00</div>
        <div class="title">Chase Chris — railing measurements</div>
        <div class="step">First: message Chris for the numbers</div>
      </div></div>
    </button>
    <button type="button" class="job" data-id="z2" aria-pressed="false">
      <div class="row"><div class="tick"></div><div class="left">
        <div class="time">16:00–17:00</div>
        <div class="title">Z2 bike 60</div>
        <div class="step">First: shoes on, easy spin (Zwift OK)</div>
      </div></div>
    </button>
  </div>

<script>
(function(){
  var KEY = "ed-today-2026-09-23-v3";
  var jobs = [].slice.call(document.querySelectorAll(".job"));
  var progress = document.getElementById("progress");
  function load(){ try { return JSON.parse(localStorage.getItem(KEY)||"{}"); } catch(e){ return {}; } }
  function save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }
  function render(){
    var s = load(), done = 0;
    jobs.forEach(function(el){
      var on = !!s[el.dataset.id];
      el.classList.toggle("done", on);
      el.setAttribute("aria-pressed", on ? "true" : "false");
      if (on) done++;
    });
    progress.textContent = done + " / " + jobs.length;
  }
  jobs.forEach(function(el){
    el.addEventListener("click", function(){
      var s = load(); s[el.dataset.id] = !s[el.dataset.id]; save(s); render();
    });
  });
  render();
})();
</script>
</body>
</html>
